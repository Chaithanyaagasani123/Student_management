<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Student Management System</title>
<style>
  body { font-family: Arial; background:#f2f4f8; margin:0; padding:20px; }
  .box { max-width:850px; margin:auto; background:#fff; padding:20px; border-radius:8px; }
  h2 { text-align:center; }
  input { padding:8px; margin:4px; width:170px; }
  button { padding:8px 14px; border:none; border-radius:4px; cursor:pointer; color:#fff; background:#2d7ff9; }
  .del { background:#e53935; } .edit { background:#fb8c00; }
  table { width:100%; border-collapse:collapse; margin-top:20px; }
  th, td { border:1px solid #ddd; padding:8px; text-align:center; }
  th { background:#2d7ff9; color:#fff; }
</style>
</head>
<body>
<div class="box">
  <h2>Student Management System</h2>
  <input type="hidden" id="id">
  <input id="name" placeholder="Name">
  <input id="email" placeholder="Email">
  <input id="course" placeholder="Course">
  <input id="age" type="number" placeholder="Age">
  <button onclick="saveStudent()">Save</button>
  <button onclick="clearForm()" style="background:#777">Clear</button>

  <table>
    <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Course</th><th>Age</th><th>Action</th></tr></thead>
    <tbody id="list"></tbody>
  </table>
</div>

<script>
const API = "/api/students";

async function loadStudents() {
  const res = await fetch(API);
  const data = await res.json();
  document.getElementById("list").innerHTML = data.map(s => `
    <tr>
      <td>${s.id}</td><td>${s.name}</td><td>${s.email}</td><td>${s.course}</td><td>${s.age}</td>
      <td>
        <button class="edit" onclick='editStudent(${JSON.stringify(s)})'>Edit</button>
        <button class="del" onclick="deleteStudent(${s.id})">Delete</button>
      </td>
    </tr>`).join("");
}

async function saveStudent() {
  const id = document.getElementById("id").value;
  const student = {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    course: document.getElementById("course").value,
    age: parseInt(document.getElementById("age").value) || null
  };
  if (!student.name) { alert("Please enter a name"); return; }
  await fetch(id ? API + "/" + id : API, {
    method: id ? "PUT" : "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(student)
  });
  clearForm();
  loadStudents();
}

function editStudent(s) {
  document.getElementById("id").value = s.id;
  document.getElementById("name").value = s.name;
  document.getElementById("email").value = s.email;
  document.getElementById("course").value = s.course;
  document.getElementById("age").value = s.age;
}

async function deleteStudent(id) {
  if (!confirm("Delete this student?")) return;
  await fetch(API + "/" + id, { method: "DELETE" });
  loadStudents();
}

function clearForm() {
  ["id","name","email","course","age"].forEach(f => document.getElementById(f).value = "");
}

loadStudents();
</script>
</body>
</html>
