<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Management System</title>
<style>
  body { font-family: Arial; background:#f2f4f8; margin:0; padding:12px; font-size:13px; }
  .box { max-width:900px; margin:auto; background:#fff; padding:14px; border-radius:8px; }
  h2 { margin:0; font-size:18px; text-align:center; }
  .form { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .field { flex:1 1 150px; display:flex; flex-direction:column; }
  input, select { padding:6px; border:1px solid #bbb; border-radius:4px; font-size:13px; }
  input.bad, select.bad { border-color:#e53935; }
  .err { color:#e53935; font-size:11px; min-height:14px; }
  button { padding:6px 12px; border:none; border-radius:4px; cursor:pointer; color:#fff; background:#2d7ff9; font-size:13px; }
  #saveBtn.update { background:#43a047; }
  .del { background:#e53935; } .edit { background:#fb8c00; } .gray { background:#777; }
  .bar { display:flex; justify-content:space-between; align-items:center; margin-top:10px; gap:8px; }
  #search { flex:1; max-width:280px; }
  table { width:100%; border-collapse:collapse; margin-top:8px; }
  th, td { border:1px solid #ddd; padding:4px 6px; text-align:center; }
  th { background:#2d7ff9; color:#fff; cursor:pointer; user-select:none; }
  td button { padding:3px 8px; font-size:12px; }
  .pager { text-align:center; margin-top:8px; }
  .pager button { margin:0 3px; padding:4px 9px; background:#e0e6f0; color:#333; }
  .pager button.on { background:#2d7ff9; color:#fff; }
</style>
</head>
<body>
<div class="box">
  <h2>Student Management System</h2>
  <input type="hidden" id="id">

  <div class="form">
    <div class="field"><input id="name" placeholder="Name"><span class="err" id="nameErr"></span></div>
    <div class="field"><input id="email" placeholder="Email (example@gmail.com)"><span class="err" id="emailErr"></span></div>
    <div class="field">
      <select id="course">
        <option value="">-- Select Course --</option>
        <option>B.Tech</option><option>M.Tech</option><option>BCA</option><option>MCA</option>
        <option>B.Sc</option><option>M.Sc</option><option>B.Com</option><option>M.Com</option>
        <option>BBA</option><option>MBA</option><option>CA</option>
      </select>
      <span class="err" id="courseErr"></span>
    </div>
    <div class="field"><input id="age" type="number" placeholder="Age"><span class="err" id="ageErr"></span></div>
  </div>
  <div>
    <button id="saveBtn" onclick="saveStudent()">Save</button>
    <button class="gray" onclick="clearForm()">Clear</button>
  </div>

  <div class="bar">
    <strong id="count">Total students: 0</strong>
    <input id="search" placeholder="Search name, email or course..." oninput="page=1;render()">
  </div>

  <table>
    <thead>
      <tr>
        <th onclick="sortBy('id')">ID <span id="s_id"></span></th>
        <th onclick="sortBy('name')">Name <span id="s_name"></span></th>
        <th onclick="sortBy('email')">Email <span id="s_email"></span></th>
        <th onclick="sortBy('course')">Course <span id="s_course"></span></th>
        <th onclick="sortBy('age')">Age <span id="s_age"></span></th>
        <th style="cursor:default">Action</th>
      </tr>
    </thead>
    <tbody id="list"></tbody>
  </table>
  <div class="pager" id="pager"></div>
</div>

<script>
const API = "/api/students";
const PAGE_SIZE = 5;
let students = [], page = 1, sortKey = "id", sortDir = 1;

function esc(t) {
  return String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

async function loadStudents() {
  const res = await fetch(API);
  students = await res.json();
  render();
}

function sortBy(key) {
  if (sortKey === key) sortDir = -sortDir; else { sortKey = key; sortDir = 1; }
  page = 1;
  render();
}

function render() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  let rows = students.filter(s =>
    !q || [s.name, s.email, s.course].some(v => String(v ?? "").toLowerCase().includes(q)));

  rows.sort((a, b) => {
    const x = a[sortKey] ?? "", y = b[sortKey] ?? "";
    if (typeof x === "number" && typeof y === "number") return (x - y) * sortDir;
    return String(x).localeCompare(String(y), undefined, {numeric:true, sensitivity:"base"}) * sortDir;
  });

  ["id","name","email","course","age"].forEach(k =>
    document.getElementById("s_" + k).textContent = k === sortKey ? (sortDir === 1 ? "▲" : "▼") : "");

  document.getElementById("count").textContent =
    "Total students: " + students.length + (q ? "  (showing " + rows.length + ")" : "");

  const pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  if (page > pages) page = pages;
  const slice = rows.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);

  document.getElementById("list").innerHTML = slice.length ? slice.map(s => `
    <tr>
      <td>${s.id}</td><td>${esc(s.name)}</td><td>${esc(s.email)}</td>
      <td>${esc(s.course)}</td><td>${s.age ?? "-"}</td>
      <td>
        <button class="edit" onclick="editStudent(${s.id})">Edit</button>
        <button class="del" onclick="deleteStudent(${s.id})">Delete</button>
      </td>
    </tr>`).join("") : `<tr><td colspan="6">No students found</td></tr>`;

  let html = `<button onclick="goPage(${page - 1})" ${page === 1 ? "disabled" : ""}>Prev</button>`;
  for (let i = 1; i <= pages; i++) html += `<button class="${i === page ? "on" : ""}" onclick="goPage(${i})">${i}</button>`;
  html += `<button onclick="goPage(${page + 1})" ${page === pages ? "disabled" : ""}>Next</button>`;
  document.getElementById("pager").innerHTML = html;
}

function goPage(p) { page = p; render(); }

function setError(field, msg) {
  document.getElementById(field + "Err").textContent = msg;
  document.getElementById(field).classList.toggle("bad", !!msg);
  return !msg;
}

function validate() {
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const course = document.getElementById("course").value;
  const ageText = document.getElementById("age").value.trim();
  let ok = true;

  if (!name) ok = setError("name", "Please enter name") && ok;
  else if (!/^[A-Za-z ]{2,50}$/.test(name)) ok = setError("name", "Name must have only letters (2-50)") && ok;
  else setError("name", "");

  if (!email) ok = setError("email", "Please enter email") && ok;
  else if (!/^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(email)) ok = setError("email", "Please enter a valid email") && ok;
  else setError("email", "");

  if (!course) ok = setError("course", "Please select a course") && ok;
  else setError("course", "");

  if (ageText === "") ok = setError("age", "Please enter age") && ok;
  else if (!Number.isInteger(Number(ageText)) || Number(ageText) < 15 || Number(ageText) > 60)
    ok = setError("age", "Please enter a valid age (15 to 60)") && ok;
  else setError("age", "");

  return ok;
}

async function saveStudent() {
  if (!validate()) return;
  const id = document.getElementById("id").value;
  const student = {
    name: document.getElementById("name").value.trim(),
    email: document.getElementById("email").value.trim(),
    course: document.getElementById("course").value,
    age: parseInt(document.getElementById("age").value)
  };

  const duplicate = students.some(s =>
    (s.email || "").toLowerCase() === student.email.toLowerCase() && String(s.id) !== id);
  if (duplicate) { setError("email", "This email already exists"); return; }

  const res = await fetch(id ? API + "/" + id : API, {
    method: id ? "PUT" : "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(student)
  });
  if (res.status === 409) { setError("email", "This email already exists"); return; }

  clearForm();
  loadStudents();
}

function editStudent(id) {
  const s = students.find(x => x.id === id);
  document.getElementById("id").value = s.id;
  document.getElementById("name").value = s.name || "";
  document.getElementById("email").value = s.email || "";
  const sel = document.getElementById("course");
  if (s.course && ![...sel.options].some(o => o.value === s.course)) sel.add(new Option(s.course, s.course));
  sel.value = s.course || "";
  document.getElementById("age").value = s.age ?? "";
  const btn = document.getElementById("saveBtn");
  btn.textContent = "Update";
  btn.classList.add("update");
  window.scrollTo(0, 0);
}

async function deleteStudent(id) {
  if (!confirm("Delete this student?")) return;
  await fetch(API + "/" + id, { method: "DELETE" });
  clearForm();
  loadStudents();
}

function clearForm() {
  ["id","name","email","course","age"].forEach(f => document.getElementById(f).value = "");
  ["name","email","course","age"].forEach(f => setError(f, ""));
  const btn = document.getElementById("saveBtn");
  btn.textContent = "Save";
  btn.classList.remove("update");
}

loadStudents();
</script>
</body>
</html>
